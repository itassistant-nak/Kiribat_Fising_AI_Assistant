server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web SPA — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Flutter compiled assets aggressively
    location ~* \.(js|wasm|dart|css|png|jpg|gif|ico|svg|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip compression for Flutter web assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm
               image/svg+xml application/json;
    gzip_min_length 1024;
}
