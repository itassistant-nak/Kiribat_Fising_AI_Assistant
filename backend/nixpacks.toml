[phases.setup]
# PHP 8.3 + SQLite extensions for Laravel 11
# Note: 'composer' is NOT a top-level nixpkg — installed via official installer below
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_sqlite",
  "php83Extensions.sqlite3",
  "php83Extensions.mbstring",
  "php83Extensions.tokenizer",
  "php83Extensions.xml",
  "php83Extensions.ctype",
  "php83Extensions.json",
  "php83Extensions.openssl",
  "php83Extensions.fileinfo",
  "php83Extensions.curl",
  "php83Extensions.zip"
]

[phases.install]
cmds = [
  "php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\" && php composer-setup.php --install-dir=/usr/local/bin --filename=composer && rm composer-setup.php",
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "mkdir -p database && touch database/database.sqlite",
  "mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache"
]
