# Let Nixpacks auto-detect PHP + Composer from composer.json.
# Do NOT override nixPkgs — many php83Extensions.* are PHP builtins
# (json, ctype, tokenizer) and cause "undefined variable" nix errors.
# SQLite (pdo_sqlite) is included in the base PHP nixpkg by default.

[phases.build]
cmds = [
  "mkdir -p database && touch database/database.sqlite",
  "mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache"
]
